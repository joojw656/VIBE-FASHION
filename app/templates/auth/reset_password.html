{% extends "base.html" %}
{% block title %}새 비밀번호 설정 | VIBE-FASHION{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h2 class="h4 fw-bold text-center mb-4">새 비밀번호 설정</h2>
                    {% include "auth/_alerts.html" %}
                    <form method="post" action="{{ url_for('auth.reset_password') }}" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="password" class="form-label">새 비밀번호</label>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" required autocomplete="new-password">
                            <div class="form-text">6자 이상 입력해 주세요.</div>
                        </div>
                        <div class="mb-3">
                            <label for="password_confirm" class="form-label">새 비밀번호 확인</label>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" minlength="6" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2">비밀번호 변경</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
