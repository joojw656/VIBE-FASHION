{% extends "base.html" %}
{% block title %}회원가입 | VIBE-FASHION{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h2 class="h4 fw-bold text-center mb-4">회원가입</h2>
                    {% include "auth/_alerts.html" %}
                    <form method="post" action="{{ url_for('auth.signup') }}" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">이름</label>
                            <input type="text" class="form-control" id="name" name="name" required autocomplete="name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" required autocomplete="new-password">
                            <div class="form-text">6자 이상 입력해 주세요.</div>
                        </div>
                        <div class="mb-3">
                            <label for="password_confirm" class="form-label">비밀번호 확인</label>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm" minlength="6" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2">가입하기</button>
                    </form>
                    <div class="d-flex align-items-center my-3 text-muted small">
                        <hr class="flex-grow-1"><span class="px-2">또는</span><hr class="flex-grow-1">
                    </div>
                    <a href="{{ url_for('auth.kakao_login') }}" class="btn btn-kakao w-100 py-2">
                        <i class="bi bi-chat-fill me-2"></i>카카오로 3초 만에 가입하기
                    </a>
                    <div class="text-center mt-3 small">
                        이미 회원이신가요? <a href="{{ url_for('auth.login') }}" class="text-decoration-none">로그인</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
