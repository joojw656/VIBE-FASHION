{% extends "base.html" %}
{% block title %}인증 메일 발송 | VIBE-FASHION{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body p-4 p-md-5">
                    <i class="bi bi-envelope-check display-4 text-success"></i>
                    <h2 class="h4 fw-bold mt-3">인증 메일을 보냈습니다</h2>
                    <div class="alert alert-info mt-3 mb-4" role="alert">
                        입력하신 이메일로 인증 링크를 보냈습니다.<br>
                        메일함에서 링크를 클릭하면 가입이 완료됩니다.
                    </div>
                    <p class="small text-muted">메일이 보이지 않으면 스팸함을 확인해 주세요.</p>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-dark px-4">로그인 페이지로</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
