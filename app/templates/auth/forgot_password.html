{% extends "base.html" %}
{% block title %}비밀번호 찾기 | VIBE-FASHION{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h2 class="h4 fw-bold text-center mb-2">비밀번호 찾기</h2>
                    <p class="text-muted small text-center mb-4">가입한 이메일을 입력하시면 재설정 링크를 보내드립니다.</p>
                    {% include "auth/_alerts.html" %}
                    <form method="post" action="{{ url_for('auth.forgot_password') }}" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2">재설정 메일 보내기</button>
                    </form>
                    <div class="text-center mt-3 small">
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none">로그인으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
